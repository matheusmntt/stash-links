<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Stash · Conexão</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        margin-bottom: 14px;
        background: color-mix(in oklch, var(--primary) 14%, transparent);
        color: var(--primary);
        animation: pop 0.25s ease-out;
      }
      .badge.error {
        background: color-mix(in oklch, var(--destructive) 14%, transparent);
        color: var(--destructive);
      }
      .badge .icon {
        width: 26px;
        height: 26px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: var(--muted-foreground);
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 20px;
      }
      .tip {
        margin-top: 18px;
        font-size: 12px;
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" id="card"><div class="spinner" style="margin: 0 auto"></div></main>
    <script type="module" src="connected.js"></script>
  </body>
</html>
